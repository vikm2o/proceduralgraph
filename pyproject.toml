[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "proceduralgraph"
version = "0.1.0"
description = "Self-evolving Procedural Graphs for LLM agents: per-step graph-derived guidance plus a gated offline refiner loop. Independent reimplementation of arXiv:2609.09153, adapted for production deployments: storage-agnostic, budgeted, resumable."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Vikash Ranjan (CTO, styls.ai)" }]
keywords = ["agents", "procedural-graph", "self-evolution", "llm", "guidance", "graph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
postgres = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29"]
s3 = ["boto3>=1.34"]
gcs = ["google-cloud-storage>=2.16"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "moto[s3]>=5.0",
  "testcontainers[postgres]>=4.5",
]

[project.scripts]
proceduralgraph = "proceduralgraph.cli:main"

[project.urls]
Homepage = "https://github.com/vikm2o/proceduralgraph"
Paper = "https://arxiv.org/abs/2609.09153"

[tool.hatch.build.targets.wheel]
packages = ["src/proceduralgraph"]

[tool.hatch.build.targets.sdist]
include = ["src/proceduralgraph", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "postgres: needs Docker (testcontainers)",
  "s3: needs moto",
  "gcs: needs a GCS emulator",
]
